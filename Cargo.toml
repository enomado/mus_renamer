[workspace]
resolver = "2"
members = ["crates/mus_core", "crates/mus_fs", "crates/mus_cli", "crates/mus_ui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/enomado/mus_renamer"

[workspace.dependencies]
mus_core = { path = "crates/mus_core" }
mus_fs = { path = "crates/mus_fs" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
walkdir = "2"
tempfile = "3"

[profile.release]
opt-level = 2
