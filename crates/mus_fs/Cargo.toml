[package]
name = "mus_fs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Filesystem execution layer for mus_renamer: never overwrite, verify every move, journal everything, undo"

[dependencies]
mus_core = { workspace = true }
serde = { workspace = true }
